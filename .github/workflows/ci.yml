name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-typecheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build (bundle)
        run: bun run build

      - name: Type-check
        run: bun run typecheck
